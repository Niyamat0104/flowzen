<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowZen — Workspace Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Space+Grotesk:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Design System -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
      .otp-input-container {
        display: flex;
        gap: 0.6rem;
        justify-content: center;
        margin: 1.5rem 0;
      }
      .otp-box {
        width: 48px;
        height: 58px;
        text-align: center;
        font-size: 1.6rem;
        font-weight: 900;
        font-family: var(--font-family-display);
        border: 3px solid var(--color-border);
        border-radius: 8px;
        box-shadow: 3px 3px 0px var(--shadow-color);
        background: var(--bg-card);
        color: var(--color-black);
        outline: none;
        transition: all 0.15s ease;
      }
      .otp-box:focus {
        background: var(--secondary-light);
        transform: translateY(-2px);
        box-shadow: 5px 5px 0px var(--shadow-color);
      }
    </style>
  </head>
  <body>
    <!-- Top Sticky Navbar -->
    <nav class="navbar">
      <a href="index.html" class="brand-logo">
        <span>⚡ FlowZen</span>
        <span class="brand-badge">DASHBOARD</span>
      </a>

      <div class="flex items-center gap-4">
        <button class="btn btn-sm btn-outline theme-toggle-btn">
          🌙 Dark Mode
        </button>
        <div
          id="user-profile-badge"
          class="badge badge-medium"
          style="font-size: 0.85rem; padding: 0.4rem 0.75rem"
        >
          👤 Loading...
        </div>
        <button class="btn btn-sm btn-outline" id="logout-btn">Log Out</button>
      </div>
    </nav>

    <!-- Dashboard Container -->
    <main style="padding: 2.5rem 1.5rem; flex: 1">
      <div class="container">
        <!-- Dashboard Top Header -->
        <div
          class="flex items-center justify-between"
          style="margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem"
        >
          <div>
            <h1
              style="
                font-size: 2.4rem;
                text-transform: uppercase;
                letter-spacing: -0.02em;
              "
            >
              FLOWZEN WORKSPACES
            </h1>
            <p style="color: var(--accent-gray); font-size: 1.05rem">
              Select a workspace board or create a new real-time intelligent
              board.
            </p>
          </div>

          <button class="btn btn-primary btn-lg" id="create-board-modal-btn">
            ➕ Create New Board
          </button>
        </div>

        <!-- Boards Grid Container -->
        <div
          id="boards-grid"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 1.75rem;
          "
        >
          <!-- Board Cards Injected via JS -->
        </div>
      </div>
    </main>

    <!-- Modal: Create Board Modal -->
    <div class="modal-backdrop" id="create-board-modal">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title">🚀 Create FlowZen Board</h3>
          <button class="modal-close" data-close-modal>✕</button>
        </div>
        <div class="modal-body">
          <form id="create-board-form">
            <div class="form-group">
              <label class="form-label">Board Title</label>
              <input
                type="text"
                class="input"
                id="board-title-input"
                required
                placeholder="e.g. Q4 Sprint Roadmap"
              />
            </div>

            <div class="form-group">
              <label class="form-label">Description (Optional)</label>
              <textarea
                class="textarea"
                id="board-desc-input"
                placeholder="Briefly describe the purpose of this board..."
              ></textarea>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-outline" data-close-modal>
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Create Board
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- JS Module Scripts -->
    <script type="module">
      import {
        initAuth,
        logoutUser,
        verifyOtpCode,
        resendOtpCode,
        getCurrentUser,
      } from "./js/auth.js";
      import { fetchUserBoards, createBoard, deleteBoard } from "./js/boards.js";
      import { getSentEmails } from "./js/email-service.js";
      import { initTheme } from "./js/theme.js";
      import { openModal, closeModal, escapeHTML } from "./js/ui-utils.js";

      document.addEventListener("DOMContentLoaded", () => {
        initTheme();

        // Handle Back-Forward Cache (bfcache) to prevent freeze on browser back button
        window.addEventListener("pageshow", (e) => {
          if (e.persisted) {
            window.location.reload();
          }
        });

        initAuth((user) => {
          if (!user) {
            window.location.href = "index.html?action=login";
            return;
          }

          const badge = document.getElementById("user-profile-badge");
          if (badge) {
            badge.innerText = `👤 ${user.displayName || user.email.split("@")[0]}`;
          }

          loadBoardsGrid();
        });

        setupOtpInputBoxes();

        document
          .getElementById("open-otp-modal-btn")
          .addEventListener("click", () => {
            openModal("otp-modal");
          });

        document
          .getElementById("open-inbox-modal-btn")
          .addEventListener("click", () => {
            renderSentEmailsModal();
          });

        document
          .getElementById("preview-inbox-otp-btn")
          .addEventListener("click", () => {
            closeModal("otp-modal");
            renderSentEmailsModal();
          });

        document
          .getElementById("view-sent-emails-btn")
          .addEventListener("click", () => {
            renderSentEmailsModal();
          });

        document
          .getElementById("submit-otp-btn")
          .addEventListener("click", () => {
            submitOtpVerification();
          });

        document
          .getElementById("resend-otp-btn")
          .addEventListener("click", () => {
            resendOtpCode();
          });

        document.getElementById("logout-btn").addEventListener("click", () => {
          logoutUser();
        });

        document
          .getElementById("create-board-modal-btn")
          .addEventListener("click", () => {
            openModal("create-board-modal");
          });

        document
          .getElementById("create-board-form")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document
              .getElementById("board-title-input")
              .value.trim();
            const desc = document
              .getElementById("board-desc-input")
              .value.trim();

            if (title) {
              const newBoard = await createBoard(title, desc);
              closeModal("create-board-modal");
              if (newBoard) {
                window.location.href = `board.html?id=${newBoard.id}`;
              }
            }
          });
      });

      function setupOtpInputBoxes() {
        const boxes = [1, 2, 3, 4, 5, 6].map((i) =>
          document.getElementById(`otp-${i}`),
        );

        boxes.forEach((box, idx) => {
          if (!box) return;

          box.addEventListener("input", (e) => {
            const val = e.target.value;
            if (val.length === 1 && idx < 5) {
              boxes[idx + 1].focus();
            }
          });

          box.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && !box.value && idx > 0) {
              boxes[idx - 1].focus();
            }
          });

          box.addEventListener("paste", (e) => {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData)
              .getData("text")
              .trim();
            if (pasted.length === 6 && /^\d+$/.test(pasted)) {
              pasted.split("").forEach((char, i) => {
                if (boxes[i]) boxes[i].value = char;
              });
              boxes[5].focus();
            }
          });
        });
      }

      function submitOtpVerification() {
        const code = [1, 2, 3, 4, 5, 6]
          .map((i) => document.getElementById(`otp-${i}`).value)
          .join("");
        const success = verifyOtpCode(code);
        if (success) {
          closeModal("otp-modal");
          document.getElementById("email-verify-banner").style.display = "none";
        }
      }

      function renderSentEmailsModal() {
        const container = document.getElementById("sent-emails-modal-body");
        const emails = getSentEmails();

        if (emails.length === 0) {
          container.innerHTML = `
          <div style="text-align: center; padding: 2rem 1rem;">
            <h3>📬 No Emails Sent Yet</h3>
            <p style="color: var(--accent-gray);">Create a new account to trigger a 6-digit OTP email.</p>
          </div>
        `;
        } else {
          container.innerHTML = `
          <p style="font-size: 0.9rem; color: var(--accent-gray); margin-bottom: 1rem;">
            Here are the real 6-digit OTP email messages dispatched to users' email addresses:
          </p>
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            ${emails
              .map(
                (msg) => `
              <div class="card" style="padding: 1rem; border: 2.5px solid var(--color-border); background: var(--bg-alt);">
                <div class="flex items-center justify-between" style="margin-bottom: 0.5rem; border-bottom: 1.5px dashed var(--color-border); padding-bottom: 0.5rem;">
                  <strong style="font-size: 0.95rem;">To: ${escapeHTML(msg.to)}</strong>
                  <span style="font-size: 0.75rem; opacity: 0.7;">${new Date(msg.sentAt).toLocaleTimeString()}</span>
                </div>
                <div style="font-size: 0.9rem; font-weight: 700; margin-bottom: 0.75rem;">Subject: ${escapeHTML(msg.subject)}</div>
                <div style="background: var(--bg-card); color: var(--color-black); padding: 1rem; border: 2px solid var(--color-border); border-radius: 8px;">
                  ${msg.bodyHTML}
                </div>
              </div>
            `,
              )
              .join("")}
          </div>
        `;
        }
        openModal("sent-emails-modal");
      }

      function loadBoardsGrid() {
        const grid = document.getElementById("boards-grid");
        fetchUserBoards((boards) => {
          if (!boards || boards.length === 0) {
            grid.innerHTML = `
            <div class="card card-yellow text-center" style="grid-column: 1 / -1; padding: 3.5rem 1.5rem;">
              <h3 style="font-size: 1.6rem; margin-bottom: 0.5rem;">No Boards Created Yet</h3>
              <p style="margin-bottom: 1.5rem;">Click "Create New Board" above to start your first real-time Kanban board!</p>
            </div>
          `;
            return;
          }

          grid.innerHTML = boards
            .map(
              (board) => `
          <div class="card card-interactive board-card-item" data-board-id="${board.id}" style="display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;">
            <div>
              <div class="flex items-center justify-between" style="margin-bottom: 0.85rem;">
                <span class="badge badge-medium">FLOWZEN BOARD</span>
                <div class="flex items-center gap-2">
                  <span style="font-size: 0.75rem; font-weight: 800; opacity: 0.7;">ID: ${escapeHTML(board.id)}</span>
                  ${board.id !== 'board_demo_1' && board.id !== 'board_demo_2' ? `
                    <button type="button" class="btn btn-sm btn-icon delete-board-btn" data-board-id="${board.id}" title="Delete Board" style="padding: 0.15rem 0.4rem; font-size: 0.75rem;">🗑️</button>
                  ` : ''}
                </div>
              </div>
              
              <h3 style="font-size: 1.35rem; margin-bottom: 0.5rem; font-weight: 900;">${escapeHTML(board.title)}</h3>
              <p style="font-size: 0.92rem; color: var(--accent-gray); margin-bottom: 1.5rem; line-height: 1.4;">
                ${escapeHTML(board.description || "No description provided")}
              </p>
            </div>

            <div style="border-top: 2.5px dashed var(--color-border); padding-top: 1.1rem; display: flex; align-items: center; justify-content: space-between;">
              <div class="board-members-avatars">
                ${(board.memberIds || [board.ownerId])
                  .filter(Boolean)
                  .slice(0, 3)
                  .map(
                    (m) => `
                  <div class="avatar-pill" title="Member">${escapeHTML(String(m).charAt(0).toUpperCase())}</div>
                `,
                  )
                  .join("")}
              </div>

              <a href="board.html?id=${board.id}" class="btn btn-sm btn-primary">
                Open Board ➔
              </a>
            </div>
          </div>
        `,
            )
            .join("");

          grid.querySelectorAll(".board-card-item").forEach((card) => {
            card.addEventListener("click", (e) => {
              if (!e.target.closest("a") && !e.target.closest("button")) {
                const bId = card.getAttribute("data-board-id");
                window.location.href = `board.html?id=${bId}`;
              }
            });
          });

          grid.querySelectorAll(".delete-board-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const bId = btn.getAttribute("data-board-id");
              if (confirm("Are you sure you want to delete this board?")) {
                deleteBoard(bId);
                loadBoardsGrid();
              }
            });
          });
        });
      }
    </script>
  </body>
</html>
