<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowZen — Workspace Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F46E5' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z'/></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Design System -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- Top Executive Navbar -->
    <nav class="navbar">
      <a href="index.html" class="brand-logo" style="display: inline-flex; align-items: center; gap: 6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-zap"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
        <span>FlowZen</span>
        <span class="brand-badge">DASHBOARD</span>
      </a>

      <div class="flex items-center gap-4">
        <button class="btn btn-sm btn-outline theme-toggle-btn">
          Dark Mode
        </button>
        <div
          id="user-profile-badge"
          class="badge badge-medium"
          style="font-size: 0.82rem; padding: 0.4rem 0.75rem"
        >
          Loading...
        </div>
        <button class="btn btn-sm btn-outline" id="logout-btn">Log Out</button>
      </div>
    </nav>

    <!-- Dashboard Container -->
    <main style="padding: 2.5rem 1.5rem; flex: 1">
      <div class="container">
        <!-- Dashboard Top Header -->
        <div
          class="flex items-center justify-between"
          style="margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem"
        >
          <div>
            <h1
              style="
                font-size: 2.2rem;
                font-weight: 800;
                font-family: var(--font-family-heading);
                letter-spacing: -0.025em;
                color: var(--color-black);
                margin-bottom: 0.35rem;
              "
            >
              FLOWZEN WORKSPACES
            </h1>
            <p style="color: var(--color-muted); font-size: 0.95rem; font-family: var(--font-family-body);">
              Select a workspace board or initialize a new real-time board.
            </p>
          </div>

          <button class="btn btn-primary btn-lg" id="create-board-modal-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: text-bottom;"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Create New Board
          </button>
        </div>

        <!-- Boards Grid Container -->
        <div
          id="boards-grid"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 1.75rem;
          "
        >
          <!-- Board Cards Injected via JS -->
        </div>
      </div>
    </main>

    <!-- Modal: Create Board Modal -->
    <div class="modal-backdrop" id="create-board-modal">
      <div class="modal" style="max-width: 650px;">
        <div class="modal-header">
          <h3 class="modal-title">CREATE FLOWZEN BOARD</h3>
          <button class="modal-close" data-close-modal aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <form id="create-board-form">
            <div class="form-group">
              <label class="form-label">Board Title <span style="color: var(--accent-coral);">*</span></label>
              <input
                type="text"
                class="input"
                id="board-title-input"
                required
                placeholder="e.g. Q4 Sprint Roadmap"
              />
            </div>

            <div class="form-group">
              <label class="form-label">Description (Optional)</label>
              <textarea
                class="textarea"
                id="board-desc-input"
                placeholder="Briefly describe the purpose of this board..."
              ></textarea>
            </div>

            <div class="grid grid-2 gap-3" style="margin-bottom: 1.2rem;">
              <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">Project Type / Category</label>
                <select class="select" id="board-category-select">
                  <option value="Software Development">Software Development</option>
                  <option value="Marketing Campaign">Marketing Campaign</option>
                  <option value="Product Design">Product Design</option>
                  <option value="Research">Research</option>
                  <option value="Event Planning">Event Planning</option>
                  <option value="Personal">Personal</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">Target Completion Deadline</label>
                <input type="date" class="input" id="board-deadline-input" />
              </div>
            </div>

            <!-- Dynamic Team Members Container -->
            <div class="form-group card card-purple" style="padding: 1.2rem; margin-bottom: 1.5rem;">
              <div class="flex items-center justify-between" style="margin-bottom: 0.85rem;">
                <label class="form-label" style="margin-bottom: 0;">Initial Team Members</label>
                <button type="button" class="btn btn-sm btn-outline" id="add-team-row-btn" style="font-size: 0.75rem;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: text-bottom;"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add Team Member
                </button>
              </div>

              <div id="create-board-team-rows" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <!-- Dynamically populated via JS -->
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-outline" data-close-modal>
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                Create Board
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- JS Module Scripts -->
    <script type="module">
      import {
        initAuth,
        logoutUser,
        getCurrentUser,
        updateUserProfile,
      } from "./js/auth.js";
      import { fetchUserBoards, createBoard, deleteBoard } from "./js/boards.js";
      import { initTheme } from "./js/theme.js";
      import { openModal, closeModal, escapeHTML, openUserProfileModal } from "./js/ui-utils.js";

      let additionalTeamRows = [];

      document.addEventListener("DOMContentLoaded", () => {
        initTheme();

        window.addEventListener("pageshow", (e) => {
          if (e.persisted) {
            window.location.reload();
          }
        });

        initAuth((user) => {
          if (!user) {
            window.location.href = "index.html?action=login";
            return;
          }

          const badge = document.getElementById("user-profile-badge");
          if (badge) {
            badge.innerText = `PROFILE (${user.displayName || user.email.split("@")[0]})`;
            badge.style.cursor = "pointer";
            badge.title = "Click to view and edit your profile";
            badge.onclick = () => {
              openUserProfileModal(getCurrentUser(), updateUserProfile);
            };
          }

          loadBoardsGrid();
        });

        document.getElementById("logout-btn").addEventListener("click", () => {
          logoutUser();
        });

        document
          .getElementById("create-board-modal-btn")
          .addEventListener("click", () => {
            additionalTeamRows = [];
            renderCreateBoardTeamRows();
            openModal("create-board-modal");
          });

        document
          .getElementById("add-team-row-btn")
          .addEventListener("click", () => {
            additionalTeamRows.push({ name: "", email: "", role: "Member" });
            renderCreateBoardTeamRows();
          });

        document
          .getElementById("create-board-form")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document
              .getElementById("board-title-input")
              .value.trim();
            const desc = document
              .getElementById("board-desc-input")
              .value.trim();
            const projectType = document
              .getElementById("board-category-select").value;
            const targetDeadline = document
              .getElementById("board-deadline-input").value || null;

            // Collect team member inputs from DOM
            const extraMembers = [];
            const container = document.getElementById("create-board-team-rows");
            container.querySelectorAll(".team-member-row-extra").forEach(row => {
              const nameInput = row.querySelector(".row-name-input");
              const emailInput = row.querySelector(".row-email-input");
              const roleSelect = row.querySelector(".row-role-select");
              if (nameInput && nameInput.value.trim()) {
                extraMembers.push({
                  name: nameInput.value.trim(),
                  email: emailInput ? emailInput.value.trim() : "",
                  role: roleSelect ? roleSelect.value : "Member"
                });
              }
            });

            if (title) {
              const newBoard = await createBoard(title, desc, projectType, targetDeadline, extraMembers);
              closeModal("create-board-modal");
              if (newBoard) {
                window.location.href = `board.html?id=${newBoard.id}`;
              }
            }
          });
      });

      function renderCreateBoardTeamRows() {
        const container = document.getElementById("create-board-team-rows");
        if (!container) return;

        const currentUser = getCurrentUser();
        const creatorName = currentUser ? (currentUser.displayName || currentUser.email.split("@")[0]) : "Board Creator";
        const creatorEmail = currentUser ? currentUser.email : "";

        let html = `
          <!-- Locked Owner Creator Row -->
          <div class="team-member-row flex items-center gap-2" style="background: var(--bg-card); padding: 0.65rem 0.85rem; border: 1px solid var(--color-border);">
            <div style="flex: 1.2;">
              <input type="text" class="input" value="${escapeHTML(creatorName)}" disabled title="Board Creator (Owner)" style="opacity: 0.85; font-weight: 700;" />
            </div>
            <div style="flex: 1.2;">
              <input type="email" class="input" value="${escapeHTML(creatorEmail)}" disabled title="Creator Email" style="opacity: 0.85;" />
            </div>
            <div style="width: 110px;">
              <select class="select" disabled style="opacity: 0.85; font-weight: 800; color: var(--primary);">
                <option selected>Owner</option>
              </select>
            </div>
            <div style="width: 32px; text-align: center; display: flex; align-items: center; justify-content: center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5;" title="Owner row cannot be removed"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
          </div>
        `;

        additionalTeamRows.forEach((row, idx) => {
          html += `
            <div class="team-member-row team-member-row-extra flex items-center gap-2" data-row-idx="${idx}" style="background: var(--bg-card); padding: 0.65rem 0.85rem; border: 1px solid var(--color-border);">
              <div style="flex: 1.2;">
                <input type="text" class="input row-name-input" placeholder="Member Name" value="${escapeHTML(row.name)}" required />
              </div>
              <div style="flex: 1.2;">
                <input type="email" class="input row-email-input" placeholder="email@example.com (optional)" value="${escapeHTML(row.email)}" />
              </div>
              <div style="width: 110px;">
                <select class="select row-role-select">
                  <option value="Member" ${row.role === 'Member' ? 'selected' : ''}>Member</option>
                  <option value="Viewer" ${row.role === 'Viewer' ? 'selected' : ''}>Viewer</option>
                </select>
              </div>
              <button type="button" class="btn btn-sm btn-icon remove-row-btn" data-row-idx="${idx}" title="Remove Member" style="width: 32px; height: 32px; padding: 0; color: var(--accent-coral); display: inline-flex; align-items: center; justify-content: center;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
          `;
        });

        container.innerHTML = html;

        container.querySelectorAll(".remove-row-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const idx = parseInt(btn.getAttribute("data-row-idx"));
            additionalTeamRows.splice(idx, 1);
            renderCreateBoardTeamRows();
          });
        });
      }

      function getMemberInitial(m) {
        if (!m) return "U";
        const str = typeof m === "object" ? (m.name || "") : String(m).trim();
        const lower = str.toLowerCase();
        if (lower.includes("priya")) return "P";
        if (lower.includes("aman")) return "A";
        const clean = str.replace(/^(usr_|user_|member_)/i, "");
        return clean.charAt(0).toUpperCase() || "U";
      }

      function loadBoardsGrid() {
        const grid = document.getElementById("boards-grid");
        fetchUserBoards((boards) => {
          if (!boards || boards.length === 0) {
            grid.innerHTML = `
            <div class="card card-yellow text-center" style="grid-column: 1 / -1; padding: 3.5rem 1.5rem;">
              <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem; font-family: var(--font-family-heading);">No Boards Created Yet</h3>
              <p style="margin-bottom: 1.5rem; color: var(--color-muted);">Click "Create New Board" above to start your first Kanban board.</p>
            </div>
          `;
            return;
          }

          grid.innerHTML = boards
            .map(
              (board) => {
                const category = board.projectType || "Software Development";
                let badgeClass = "badge-medium";
                if (category === "Marketing Campaign") badgeClass = "badge-urgent";
                else if (category === "Product Design") badgeClass = "badge-low";
                else if (category === "Research") badgeClass = "badge-high";

                const deadlineFormatted = board.targetDeadline 
                  ? `📅 ${board.targetDeadline}`
                  : `📅 Continuous`;

                const members = Array.isArray(board.team) && board.team.length > 0 
                  ? board.team 
                  : (board.memberIds || [board.ownerId]);

                return `
          <div class="board-card-item" data-board-id="${board.id}">
            <div>
              <div class="board-card-header">
                <span class="badge ${badgeClass}">${escapeHTML(category)}</span>
                <div class="flex items-center gap-2">
                  <span style="font-size: 0.76rem; font-weight: 600; color: var(--color-muted);" title="Target Deadline">${escapeHTML(deadlineFormatted)}</span>
                  ${board.id !== 'board_demo_1' && board.id !== 'board_demo_2' ? `
                    <button type="button" class="btn btn-sm btn-icon delete-board-btn" data-board-id="${board.id}" title="Delete Board" style="padding: 0.2rem 0.45rem; font-size: 0.72rem; color: var(--accent-coral);">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    </button>
                  ` : ''}
                </div>
              </div>
              
              <h3 class="board-card-title">${escapeHTML(board.title)}</h3>
              <p class="board-card-desc">
                ${escapeHTML(board.description || "No workspace description provided")}
              </p>
            </div>

            <div class="board-card-footer">
              <div class="board-members-avatars">
                ${members
                  .slice(0, 4)
                  .map(
                    (m) => `
                  <div class="avatar-pill" title="${typeof m === 'object' ? (m.name || 'Member') : 'Member'}">${getMemberInitial(m)}</div>
                `,
                  )
                  .join("")}
              </div>

              <a href="board.html?id=${board.id}" class="btn btn-sm btn-primary" style="display: inline-flex; align-items: center; gap: 6px;">
                Open Board <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </a>
            </div>
          </div>
        `;
              }
            )
            .join("");

          grid.querySelectorAll(".board-card-item").forEach((card) => {
            card.addEventListener("click", (e) => {
              if (!e.target.closest("a") && !e.target.closest("button")) {
                const bId = card.getAttribute("data-board-id");
                window.location.href = `board.html?id=${bId}`;
              }
            });
          });

          grid.querySelectorAll(".delete-board-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const bId = btn.getAttribute("data-board-id");
              if (confirm("Are you sure you want to delete this board?")) {
                deleteBoard(bId);
                loadBoardsGrid();
              }
            });
          });
        });
      }
    </script>
  </body>
</html>
